name: release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: amd64
          - runner: windows-11-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: build portable ${{ matrix.arch }}
        shell: bash
        run: ./create.sh ${{ matrix.arch }}

      - name: zip
        shell: pwsh
        run: Compress-Archive -Path appleJuice-Portable-${{ matrix.arch }} -DestinationPath appleJuice-Portable-${{ matrix.arch }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: appleJuice-Portable-${{ matrix.arch }}
          path: appleJuice-Portable-${{ matrix.arch }}.zip
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          body: appleJuice, Portable, ohne Setup, mit Java, einfach downloaden und starten.
          fail_on_unmatched_files: true
          files: |
            dist/appleJuice-Portable-amd64.zip
            dist/appleJuice-Portable-aarch64.zip
